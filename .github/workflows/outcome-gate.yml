# The outcome gate, enforced on every push and pull request.
#
# README.md documents this gate as five commands and says none of them is
# optional. Until now nothing enforced that: the gate ran only when a
# contributor remembered to run it. Each job below is one of those commands,
# split so a failure names which part of the gate broke rather than reporting
# a single opaque red.
name: outcome gate

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  suite:
    name: suite (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the floor because tomllib lands there, and README.md treats a
        # tomllib-less interpreter as the degraded path: the TOML assertions
        # skip rather than fail, so a generated Codex manifest no parser would
        # accept could ship green. Every version here parses the TOML for real.
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Five tests prove an unreadable dispatch state denies, by chmod 000 on a
      # directory. Root bypasses permission bits, so under root they skip and
      # the suite still reports OK. That is the exact fail-open shape the
      # guards in this repo exist to close, so refuse the run instead of
      # letting the gate pass while silently covering only part of the suite.
      - name: Refuse to run the suite as root
        run: |
          if [ "$(id -u)" -eq 0 ]; then
            echo "::error::Running as root. The permission-bit tests would skip and this gate would pass fail-open."
            exit 1
          fi

      - name: Capability gate
        run: python3 scripts/validate_roles.py

      # --check is per host: a hosts/<host>.json change can leave agents/ in
      # sync while that host's dist/ directory goes stale, so each host is
      # checked on its own.
      - name: Generated agents match roles/ and hosts/
        run: |
          python3 scripts/render_agents.py --host claude-code --check
          python3 scripts/render_agents.py --host codex --check
          python3 scripts/render_agents.py --host cursor --check

      # The bundle gate, not just the agent files. A rebuild into a temp
      # directory and a byte comparison, because a hash manifest cannot tell a
      # stale bundle from a current one.
      - name: Built bundle matches its sources
        run: python3 scripts/build_adapter.py --host claude-code --check

      - name: Test suite
        run: python3 -m unittest discover -s tests -t .

  manifest:
    name: plugin manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install the Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      # The suite does not read .claude-plugin/, so a manifest that disagrees
      # with itself passes it cleanly. A version bump once moved plugin.json
      # and left the marketplace entry behind, and only this caught it.
      - name: Validate the plugin manifest
        run: claude plugin validate .
