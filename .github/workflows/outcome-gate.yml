# The outcome gate, enforced on every push and pull request.
#
# README.md documents this gate as five commands and says none of them is
# optional. Until now nothing enforced that: the gate ran only when a
# contributor remembered to run it. Each job below is one of those commands,
# split so a failure names which part of the gate broke rather than reporting
# a single opaque red.
name: outcome gate

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  suite:
    name: suite (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.12 is the floor: tomllib is in standard library, Path.resolve loop
        # handling is modern, and type/f-string semantics are stable.
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Five tests prove an unreadable dispatch state denies, by chmod 000 on a
      # directory. Root bypasses permission bits, so under root they skip and
      # the suite still reports OK. That is the exact fail-open shape the
      # guards in this repo exist to close, so refuse the run instead of
      # letting the gate pass while silently covering only part of the suite.
      - name: Refuse to run the suite as root
        run: |
          if [ "$(id -u)" -eq 0 ]; then
            echo "::error::Running as root. The permission-bit tests would skip and this gate would pass fail-open."
            exit 1
          fi

      - name: Install linter and formatter
        run: pip install ruff

      - name: Code quality and formatting
        run: python3 tools/lint.py --check

      - name: Capability gate
        run: python3 scripts/validate_roles.py

      # --check is per host: a hosts/<host>.json change can leave agents/ in
      # sync while that host's dist/ directory goes stale, so each host is
      # checked on its own.
      - name: Generated agents match roles/ and hosts/
        run: |
          python3 scripts/render_agents.py --host claude-code --check
          python3 scripts/render_agents.py --host codex --check
          python3 scripts/render_agents.py --host cursor --check
          python3 scripts/render_agents.py --host gemini --check

      # The bundle gate: build and verify all adapter bundles.
      - name: Build and check adapter bundles
        run: python3 scripts/build_adapter.py --all --check

      # What each host actually offers, and whether every role depends only
      # on capabilities that host declares AND sources. An unsourced claim
      # bears no weight: this is the gate that refuses a guarantee resting on
      # inference rather than on the host's own words.
      - name: Host interfaces are sourced, and roles rely only on what is
        run: python3 scripts/validate_interfaces.py

      - name: Test suite
        run: python3 -m unittest discover -s tests -t .

  manifest:
    name: plugin manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Build Claude Code bundle
        run: python3 scripts/build_adapter.py --host claude-code

      # The BUNDLE, not the repository root. Since ADR 0001 step 3 the two
      # manifests live in adapters/claude-code/ and the root is no longer a
      # plugin - and `claude plugin validate .` does not fail there, it
      # silently switches to validating components and still exits 0. A gate
      # that keeps passing while no longer doing its job is worse than one
      # that breaks, so the target moved with the files.
      - name: Validate the plugin manifest
        run: |
          claude plugin validate dist/claude-code \
            | tee /dev/stderr | grep -q "Validating marketplace manifest"

      # The only gate that runs the host against the artifact. --require-cli so
      # a runner without the CLI fails here rather than skipping quietly, which
      # would be a gate reporting success for work it never did.
      - name: Built bundle installs and its parts resolve
        run: python3 scripts/smoke_install.py --host claude-code --require-cli
